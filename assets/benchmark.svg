<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="Tracker benchmark animation">
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="480" y2="0">
      <stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#eeeef0"/><stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="blue" cx="0" cy=".4" r=".8"><stop offset="0" stop-color="#4f46e5" stop-opacity=".7"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <radialGradient id="orange" cx="1" cy=".6" r=".75"><stop offset="0" stop-color="#db2777" stop-opacity=".65"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="480" height="240" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="480" height="240" fill="#0b0f1f"/>
    <rect width="480" height="240" fill="url(#blue)"/>
    <rect width="480" height="240" fill="url(#orange)"/>
    <g><animateMotion path="M-30 90C100 40 200 130 290 80S400 40 520 90" dur="10s" repeatCount="indefinite"/><rect x="-22" y="-16" width="44" height="30" stroke="url(#ink)" fill="none" stroke-opacity="1"/></g><g><animateMotion path="M-30 90C100 40 200 130 290 80S400 40 520 90" dur="10s" repeatCount="indefinite"/><rect x="-18" y="-20" width="44" height="30" stroke="url(#ink)" fill="none" stroke-opacity="0.6"/></g><g><animateMotion path="M-30 90C100 40 200 130 290 80S400 40 520 90" dur="10s" repeatCount="indefinite"/><rect x="-27" y="-11" width="44" height="30" stroke="url(#ink)" fill="none" stroke-opacity="0.4"/></g><g><animateMotion path="M-30 90C100 40 200 130 290 80S400 40 520 90" dur="10s" repeatCount="indefinite"/><path d="M-13 0H13M-13-6V6M3-1L8-8" stroke="url(#ink)" fill="none" stroke-width="1.8"/></g><text x="28" y="159" font-size="11" fill="#9a9ca8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">accuracy</text>
    <rect x="110" y="150" width="340" height="10" rx="2" fill="#eeeef0" fill-opacity=".07"/>
    <rect x="110" y="150" height="10" rx="2" fill="url(#ink)"><animate attributeName="width" values="250;320;280;250" dur="8s" repeatCount="indefinite"/></rect><text x="28" y="179" font-size="11" fill="#9a9ca8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">stability</text>
    <rect x="110" y="170" width="340" height="10" rx="2" fill="#eeeef0" fill-opacity=".07"/>
    <rect x="110" y="170" height="10" rx="2" fill="url(#ink)"><animate attributeName="width" values="200;250;330;200" dur="9s" repeatCount="indefinite"/></rect><text x="28" y="199" font-size="11" fill="#9a9ca8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">speed</text>
    <rect x="110" y="190" width="340" height="10" rx="2" fill="#eeeef0" fill-opacity=".07"/>
    <rect x="110" y="190" height="10" rx="2" fill="url(#ink)"><animate attributeName="width" values="310;230;270;310" dur="10s" repeatCount="indefinite"/></rect><text x="28" y="219" font-size="11" fill="#9a9ca8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">resources</text>
    <rect x="110" y="210" width="340" height="10" rx="2" fill="#eeeef0" fill-opacity=".07"/>
    <rect x="110" y="210" height="10" rx="2" fill="url(#ink)"><animate attributeName="width" values="180;260;210;180" dur="11s" repeatCount="indefinite"/></rect>
  </g>
</svg>
